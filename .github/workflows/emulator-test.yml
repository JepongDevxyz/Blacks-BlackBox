name: Emulator Stress Test

on:
  workflow_dispatch:
    inputs:
      muse_apk_url:
        description: "URL of the Muse APK to test"
        required: true
        type: string
      target:
        description: "Which app to drive"
        required: true
        default: "muse"
        type: choice
        options:
          - muse
      login_email:
        description: "Email used for the in-clone sign-in"
        required: true
        default: "jepongspideymuse@gmail.com"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  stress:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap Android SDK (ARM runner)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          ls "$ANDROID_HOME/cmdline-tools/latest/bin"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"
      - name: Fetch CI-built DevxyzClone APK
              env:
                        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                run: |
                                          for i in $(seq 1 40); do ID=$(gh api "repos/${{ github.repository }}/actions/workflows/android.yml/runs?head_sha=${{ github.sha }}&per_page=5" --jq '[.workflow_runs[]|select(.conclusion=="success")][0].id // empty'); if [ -n "ID" ]; then gh run download "ID" --name DevxyzClone-engine-debug --dir "$RUNNER_TEMP/cloneapk" && break; fi; echo "waiting for CI build... $i"; sleep 45; done; ls -la "$RUNNER_TEMP/cloneapk"
      - name: Download target APK
        run: |
          mkdir -p "$RUNNER_TEMP/testapks"
          curl -L --fail -o "$RUNNER_TEMP/testapks/target.apk" "${{ inputs.muse_apk_url }}"
          ls -la "$RUNNER_TEMP/testapks"
          CLONE_APK=$(ls "$RUNNER_TEMP/cloneapk"/*universal*.apk | head -1)
          echo "CLONE_APK=$CLONE_APK" >> "$GITHUB_ENV"
          echo "TARGET_APK=$RUNNER_TEMP/testapks/target.apk" >> "$GITHUB_ENV"
      - name: Emulator stress drive
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TEST_TARGET: ${{ inputs.target }}
          LOGIN_EMAIL: ${{ inputs.login_email }}
          OUT_DIR: emu-out
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 emu/emu_drive.py
      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-bench-out
          path: emu-out
          if-no-files-found: warn
